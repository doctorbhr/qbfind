name: CI

on:
  push:
    branches: [ main, "fix/*", "feat/*", "ci/*" ]
  pull_request:
    branches: [ main ]

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: Run go test
        working-directory: .
        run: |
          go env
          go version
          go test ./... -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: wailsapp/frontend
        run: |
          npm ci
      - name: Build frontend
        working-directory: wailsapp/frontend
        run: |
          npm run build
